<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">

<style>
  .calendar-intro{align-items:center;margin-bottom:11px}.calendar-intro h2{font-size:19px}.calendar-intro p{max-width:760px}
  .month-control{display:flex;align-items:center;gap:5px;flex-shrink:0}.month-control .field{height:31px;padding:5px 7px;font-size:11px}.month-step{width:30px;height:30px;padding:0;display:grid;place-items:center}
  .calendar-legend{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin:0 0 8px;color:var(--muted);font-size:9.5px}.calendar-legend span{display:inline-flex;align-items:center;gap:5px}.legend-swatch{width:10px;height:10px;border:1px solid #d9e0d4;border-radius:2px}.legend-swatch.real{background:#edf8e8}.legend-swatch.partial{background:#fff8df}.legend-swatch.forecast{background:#fff}
  .cash-reconciliation{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin:0 0 8px}.cash-step{position:relative;min-width:0;padding:10px 11px;background:#fff;border:1px solid var(--border);border-radius:9px}.cash-step .label{display:block;color:var(--muted);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.25px}.cash-step .value{display:block;margin-top:4px;color:var(--header);font-size:17px;font-weight:700;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}.cash-step .detail{display:block;margin-top:5px;color:var(--muted);font-size:9px;line-height:1.35}.cash-step .sign{color:var(--teal);margin-right:3px}.cash-step.final{border-color:#b7d9cf;background:#f4fbf8}.cash-proof{margin:0 0 10px;padding:7px 10px;border-radius:7px;background:#eef7f4;color:#245f4b;font-size:10px;line-height:1.4}.cash-proof.warning{background:#fff3e6;color:#94561e}
  .calendar-panel{padding:0;overflow:hidden}.calendar-scroll{width:100%;overflow:auto;max-height:calc(100vh - 340px);min-height:320px;overscroll-behavior:contain}
  .calendar-table{width:872px;min-width:872px;table-layout:fixed;border-collapse:separate;border-spacing:0;font-size:10px;font-variant-numeric:tabular-nums}
  .calendar-table th{position:sticky;top:0;z-index:6;background:#12313f;color:#fff;padding:6px 4px;border-right:1px solid rgba(255,255,255,.13);font-size:8px;line-height:1.1;text-transform:uppercase;letter-spacing:.15px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .calendar-table th:first-child,.calendar-table th:nth-child(2){text-align:left}.calendar-table td{height:27px;padding:3px 4px;border-right:1px solid rgba(18,49,63,.07);border-bottom:1px solid rgba(18,49,63,.08);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#fff}
  .calendar-table tr.row-real td{background:#edf8e8}.calendar-table tr.row-partial td{background:#fff8df}.calendar-table tr.row-projetado td{background:#fff;color:#586b73}
  .calendar-table tr.row-opening td{background:#eaf0f2;color:#34515d;font-weight:700;border-bottom:2px solid #8da4ad}
  .calendar-table tr:hover td{box-shadow:inset 0 0 0 999px rgba(0,166,166,.045)}.calendar-table tr.today td{border-top:1px solid #00a6a6;border-bottom-color:#00a6a6}
  .calendar-table th:first-child,.calendar-table td:first-child{position:sticky;left:0;z-index:4;text-align:left;font-weight:700}.calendar-table th:nth-child(2),.calendar-table td:nth-child(2){position:sticky;left:70px;z-index:4;text-align:left}.calendar-table th:first-child,.calendar-table th:nth-child(2){z-index:8}
  .calendar-table .meta-col{color:#765b13}.calendar-table th.meta-col{background:#80611c;color:#fff}.calendar-table .sales-col{font-weight:700;color:#0b5963}.calendar-table th.sales-col{background:#0d6e78;color:#fff}.calendar-table .cash-col{font-weight:700}.calendar-table .negative{color:#ad3e3e}
  .cell-detail{display:inline-flex;align-items:center;justify-content:flex-end;gap:2px;width:100%}.detail-trigger{width:14px;height:14px;border:0;border-radius:50%;padding:0;background:rgba(18,49,63,.10);color:#34515d;font:700 8px/14px Roboto,Arial,sans-serif;cursor:pointer;flex:0 0 14px}.detail-trigger:hover,.detail-trigger:focus-visible{background:#12313f;color:#fff}.detail-trigger:focus-visible{outline:2px solid #00a6a6;outline-offset:1px}
  .detail-popover{position:fixed;z-index:150;width:245px;background:#12313f;color:#fff;border:1px solid rgba(255,255,255,.16);border-radius:10px;padding:11px 12px;box-shadow:0 12px 36px rgba(0,0,0,.28);display:none}.detail-popover.show{display:block}.detail-popover h3{font-size:11.5px;margin:0 0 7px}.detail-line{display:flex;justify-content:space-between;gap:15px;padding:4px 0;border-top:1px solid rgba(255,255,255,.09);font-size:10.5px}.detail-line span{color:#b9cbd1}.detail-line strong{font-variant-numeric:tabular-nums}.detail-note{font-size:9px;line-height:1.4;color:#b9cbd1;margin-top:7px}.detail-warning{color:#ffd38a;margin-top:6px;font-size:9px;line-height:1.35}
  .detail-list{max-height:240px;overflow:auto;overscroll-behavior:contain}.detail-list .detail-line span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.detail-total{border-top:1px solid rgba(255,255,255,.28)}
  .calendar-empty{padding:38px;text-align:center;color:var(--muted);font-size:12px}
  .calendar-table tfoot td{position:static;background:#f7f9f6;font-weight:700;border-top:1px solid #cdd7d0;border-bottom:0}.calendar-table tfoot tr.foot-projected td{color:#586b73;background:#fff}.calendar-table tfoot tr:last-child td{position:sticky;bottom:0;z-index:5;background:#f4f7f3;border-top:2px solid #12313f}.calendar-table tfoot tr:last-child td:first-child,.calendar-table tfoot tr:last-child td:nth-child(2){z-index:7;background:#f4f7f3}
  @media(max-width:760px){.calendar-intro{display:flex;gap:8px}.calendar-intro p{display:none}.calendar-intro h2{font-size:17px}.cash-reconciliation{grid-template-columns:repeat(2,minmax(0,1fr))}.cash-step .value{font-size:15px}.calendar-scroll{max-height:calc(100vh - 360px)}.calendar-panel{margin-left:-5px;margin-right:-5px;border-radius:8px}.detail-popover{left:10px!important;right:10px!important;top:auto!important;bottom:10px;width:auto}.calendar-table{font-size:10px}.calendar-table td{padding:4px 6px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
<script src="assets/supabase-client.js"></script>

<body>
<div class="app">
  <header>
    <div class="head-row"><div class="brand"><div class="mark" aria-hidden="true">P</div><div><h1 data-app-nome>Painel</h1><span data-app-subtitulo>Painel de Gestão</span></div></div><div class="head-meta"><div class="unidade">Calendário</div></div></div>
    <nav class="tabs"><a href="./">Visão Geral</a><a href="vendas.html">Faturamento</a><a href="caixa.html">Caixa</a><a href="dre.html">DRE</a><a href="despesas.html">Despesas</a><a href="conciliacao.html">Conciliação</a><a href="planejamento.html">Planejamento</a><a href="calendario.html" class="active">Calendário</a><a href="rotinas.html" class="routines">Rotinas</a></nav>
  </header>
  <main id="main"><div class="loading">Carregando calendário…</div></main>
</div>
<div id="detailPopover" class="detail-popover" role="dialog" aria-live="polite"></div>
<script>
const sb=SirFisherSupabase;
const esc=SirFisherDOM.escapeHTML;
const DIAS=['','seg','ter','qua','qui','sex','sáb','dom'];
const MOEDA=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
const NUMERO=new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
let ROWS=[];
let AUTH=null;
let DESPESAS_DIA={};
let SALDOS_DIA={};
let CORTE;
let hoverTimer=null;
let CARGA_ATUAL=0;
const HOVER_FINO=window.matchMedia('(hover: hover) and (pointer: fine)').matches;

function mesAtual(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function mesISO(){return `${document.getElementById('mesSel')?.value||mesAtual()}-01`;}
function dataBR(iso){const [a,m,d]=iso.split('-');return `${d}/${m}/${a.slice(2)}`;}
function diaAnteriorBR(iso){const d=new Date(`${iso}T00:00:00Z`);d.setUTCDate(d.getUTCDate()-1);return `${String(d.getUTCDate()).padStart(2,'0')}/${String(d.getUTCMonth()+1).padStart(2,'0')}`;}
function dinheiro(v){return v==null?'—':MOEDA.format(Number(v)||0);}
function compacto(v){if(v==null)return'—';const n=Number(v)||0;return Math.abs(n)<.005?'–':NUMERO.format(n);}
function brlResumo(v){if(v==null||isNaN(v))return'—';const n=Number(v),a=Math.abs(n);if(a>=1e6)return'R$ '+(n/1e6).toFixed(2).replace('.',',')+' mi';if(a>=1e3)return'R$ '+(n/1e3).toFixed(1).replace('.',',')+' mil';return'R$ '+n.toFixed(0);}
function valorResumo(v){return `<span title="Valor exato: ${dinheiro(v)}">${brlResumo(v)}</span>`;}
function classeValor(v){return Number(v)<0?'negative':'';}
function valorSimples(v,extra=''){return `<span class="${classeValor(v)} ${extra}">${compacto(v)}</span>`;}
function valorDetalhado(v,i,tipo,extra=''){return `<span class="cell-detail ${extra}"><span class="${classeValor(v)}">${compacto(v)}</span><button type="button" class="detail-trigger" data-row="${i}" data-detail="${tipo}" title="Ver detalhamento" aria-label="Ver detalhamento">i</button></span>`;}
function erroTransitorio(error){
  const texto=[error?.code,error?.message,error?.details,error?.hint].filter(Boolean).join(' ');
  return Number(error?.status)>=500||/57014|statement timeout|canceling statement|failed to fetch|network/i.test(texto);
}

// O corte de caixa para no dia anterior de propósito, porque o extrato do dia
// ainda está incompleto. Quando o extrato já traz movimentos do dia, eles
// existem no banco mas continuam fora do realizado do Calendário — sem aviso,
// essa diferença passa despercebida.
function montarAvisoCorte(primeiroDia){
  if(!CORTE||!CORTE.corte_caixa)return'';
  if(primeiroDia&&primeiroDia.slice(0,7)!==CORTE.corte_caixa.slice(0,7))return'';
  const avisos=[];
  const resultado=Number(CORTE.resultado_apos_corte)||0;
  const dias=Number(CORTE.dias_apos_corte)||0;
  if(dias>0&&Math.abs(resultado)>=.05)
    avisos.push(`O extrato já registra ${dias===1?'1 dia':dias+' dias'} depois do corte de caixa (${dataBR(CORTE.corte_caixa)}), com variação líquida de ${dinheiro(resultado)}. Esses dias ainda aparecem como projeção e só entram no realizado quando o corte avançar.`);
  if(CORTE.snapshot_saldo&&CORTE.snapshot_saldo<CORTE.corte_caixa)
    avisos.push(`O snapshot diário de saldo está em ${dataBR(CORTE.snapshot_saldo)}, atrás do corte (${dataBR(CORTE.corte_caixa)}): o painel não foi atualizado depois da última importação, então DRE, Despesas e Conciliação podem estar defasados.`);
  return avisos.length?`<div class="cash-proof warning">${avisos.map(esc).join(' ')}</div>`:'';
}

function render(){
  const hoje=new Date();const hojeISO=`${hoje.getFullYear()}-${String(hoje.getMonth()+1).padStart(2,'0')}-${String(hoje.getDate()).padStart(2,'0')}`;
  const soma=(k,rows=ROWS)=>rows.reduce((s,r)=>s+(Number(r[k])||0),0);const inicio=ROWS[0]||{},fim=ROWS[ROWS.length-1]||{};
  const realizados=ROWS.filter(r=>r.recebimento_debito==null),projetados=ROWS.filter(r=>r.recebimento_debito!=null);
  const saldoAbertura=ROWS.length?(Number(inicio.saldo_caixa)||0)-(Number(inicio.recebimento_total)||0)+(Number(inicio.despesa_total)||0):null;
  const recebimentos=soma('recebimento_total'),despesas=soma('despesa_total'),saldoFinal=ROWS.length?Number(fim.saldo_caixa):null;
  const diferenca=ROWS.length?saldoFinal-(saldoAbertura+recebimentos-despesas):null;
  const corteReal=realizados.length?dataBR(realizados[realizados.length-1].dia):null;
  const abertura=ROWS.length?`<tr class="row-opening"><td>Abertura</td><td>${diaAnteriorBR(inicio.dia)}</td><td></td><td></td><td></td><td></td><td></td><td></td><td class="cash-col">${valorSimples(saldoAbertura)}</td></tr>`:'';
  const linhaReal=realizados.length?`<tr><td title="Realizado até ${corteReal}">Realizado</td><td>${corteReal.slice(0,5)}</td><td colspan="4"></td><td>${valorSimples(soma('recebimento_total',realizados))}</td><td>${valorSimples(soma('despesa_total',realizados))}</td><td></td></tr>`:'';
  const linhaProj=projetados.length?`<tr class="foot-projected"><td title="Projetado a partir de ${dataBR(projetados[0].dia)}">Projetado</td><td>${dataBR(projetados[0].dia).slice(0,5)}+</td><td colspan="4"></td><td>${valorSimples(soma('recebimento_total',projetados))}</td><td>${valorSimples(soma('despesa_total',projetados))}</td><td></td></tr>`:'';
  const rodape=ROWS.length?`<tfoot>${linhaReal}${linhaProj}<tr><td>Total do mês</td><td></td><td class="meta-col">${valorSimples(fim.meta_acumulada)}</td><td class="sales-col">${valorSimples(fim.faturamento_acumulado)}</td><td class="meta-col">${valorSimples(soma('meta_dia'))}</td><td class="sales-col">${valorSimples(soma('faturamento_dia'))}</td><td>${valorSimples(recebimentos)}</td><td>${valorSimples(despesas)}</td><td class="cash-col">${valorSimples(saldoFinal)}</td></tr></tfoot>`:'';
  const resumoCaixa=ROWS.length?`
    <div class="cash-reconciliation" aria-label="Reconciliação do caixa do mês">
      <div class="cash-step"><span class="label">Saldo de abertura</span><span class="value">${valorResumo(saldoAbertura)}</span><span class="detail">Posição antes do dia 1º</span></div>
      <div class="cash-step"><span class="label"><b class="sign">+</b> Recebimentos</span><span class="value">${valorResumo(recebimentos)}</span><span class="detail">${valorResumo(soma('recebimento_total',realizados))} realizado${projetados.length?' + '+valorResumo(soma('recebimento_total',projetados))+' projetado':''}</span></div>
      <div class="cash-step"><span class="label"><b class="sign">−</b> Despesas</span><span class="value">${valorResumo(despesas)}</span><span class="detail">${valorResumo(soma('despesa_total',realizados))} realizado${projetados.length?' + '+valorResumo(soma('despesa_total',projetados))+' projetado':''}</span></div>
      <div class="cash-step final"><span class="label"><b class="sign">=</b> Saldo no fechamento</span><span class="value">${valorResumo(saldoFinal)}</span><span class="detail">Após todos os fluxos do mês</span></div>
    </div>
    <div class="cash-proof${Math.abs(diferenca)>.05?' warning':''}">${Math.abs(diferenca)<=.05?'Conciliação fechada':'Atenção: há diferença não conciliada'}: saldo de abertura + recebimentos − despesas = saldo final · variação líquida ${dinheiro(recebimentos-despesas)} · diferença ${dinheiro(Math.abs(diferenca)<=.05?0:diferenca)}</div>`:'';
  const avisoCorte=montarAvisoCorte(ROWS[0]?.dia);
  document.getElementById('main').innerHTML=`
    <div class="page-intro calendar-intro"><div><h2>Calendário financeiro</h2><p>Visão diária compacta: realizado em verde, transição de carga em amarelo e projeções futuras em branco. Valores da tabela sem centavos; toque no <b>i</b> para abrir os detalhes.</p></div><div class="month-control"><button class="button secondary month-step" id="mesAnterior" aria-label="Mês anterior">‹</button><input class="field" type="month" id="mesSel" value="${mesISO().slice(0,7)}" aria-label="Mês do calendário"><button class="button secondary month-step" id="mesSeguinte" aria-label="Mês seguinte">›</button></div></div>
    <div class="calendar-legend"><span><i class="legend-swatch real"></i>Realizado</span><span><i class="legend-swatch partial"></i>Cortes diferentes</span><span><i class="legend-swatch forecast"></i>Projeção</span></div>
    ${resumoCaixa}${avisoCorte}
    <section class="panel calendar-panel"><div class="calendar-scroll"><table class="calendar-table"><colgroup><col style="width:70px"><col style="width:42px"><col style="width:92px"><col style="width:92px"><col style="width:78px"><col style="width:84px"><col style="width:106px"><col style="width:100px"><col style="width:96px"></colgroup><thead><tr><th>Data</th><th>Dia</th><th class="meta-col" title="Meta acumulada até o dia">Meta acum.</th><th class="sales-col" title="Faturamento realizado/projetado acumulado">Fat. acum.</th><th class="meta-col">Meta dia</th><th class="sales-col">Fat. dia</th><th title="Entradas efetivas e projeções">Recebimentos</th><th title="Saídas efetivas e projeções">Despesas</th><th title="Saldo acumulado do fluxo de caixa">Saldo caixa</th></tr></thead><tbody>${abertura}${ROWS.map((r,i)=>`<tr class="row-${r.modo}${r.dia===hojeISO?' today':''}"><td>${dataBR(r.dia)}</td><td>${DIAS[Number(r.dia_semana)]||'—'}</td><td class="meta-col">${valorSimples(r.meta_acumulada)}</td><td class="sales-col">${valorSimples(r.faturamento_acumulado)}</td><td class="meta-col">${valorSimples(r.meta_dia)}</td><td class="sales-col">${valorDetalhado(r.faturamento_dia,i,'vendas')}</td><td>${valorDetalhado(r.recebimento_total,i,'recebimentos')}</td><td>${valorDetalhado(r.despesa_total,i,'despesas')}</td><td class="cash-col">${r.recebimento_debito==null?valorDetalhado(r.saldo_caixa,i,'saldo'):valorSimples(r.saldo_caixa)}</td></tr>`).join('')||'<tr><td colspan="9" class="calendar-empty">Sem dados para este mês.</td></tr>'}</tbody>${rodape}</table></div></section>`;
  document.getElementById('mesSel').addEventListener('change',carregar);
  document.getElementById('mesAnterior').addEventListener('click',()=>moverMes(-1));
  document.getElementById('mesSeguinte').addEventListener('click',()=>moverMes(1));
  document.querySelectorAll('.detail-trigger').forEach(b=>b.addEventListener('click',abrirDetalhe));
  if(HOVER_FINO)document.querySelectorAll('.detail-trigger[data-detail="despesas"]').forEach(b=>{
    const cell=b.closest('.cell-detail');
    cell.addEventListener('mouseenter',()=>{clearTimeout(hoverTimer);mostrarDetalhe(b);});
    cell.addEventListener('mouseleave',agendarFecharDetalhe);
  });
}

function agendarFecharDetalhe(){clearTimeout(hoverTimer);hoverTimer=setTimeout(fecharDetalhe,300);}

function moverMes(delta){const input=document.getElementById('mesSel');const [a,m]=input.value.split('-').map(Number);const d=new Date(a,m-1+delta,1);input.value=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;carregar();}
function linha(rotulo,valor){return `<div class="detail-line"><span>${esc(rotulo)}</span><strong>${dinheiro(valor)}</strong></div>`;}

function abrirDetalhe(event){event.stopPropagation();mostrarDetalhe(event.currentTarget);}

function listaDespesas(itens,total){
  if(!itens.length)return '<div class="detail-note">Nenhuma despesa registrada neste dia.</div>';
  return `<div class="detail-list">${itens.map(d=>linha(d.descricao,d.valor)).join('')}</div><div class="detail-total">${linha('Total',total)}</div>`;
}

async function mostrarDetalhe(button){
  const r=ROWS[Number(button.dataset.row)];const tipo=button.dataset.detail;const pop=document.getElementById('detailPopover');let html='';
  const caixaRealizado=r.recebimento_debito==null;
  pop.dataset.dia=r.dia;pop.dataset.tipo=tipo;
  if(tipo==='vendas')html=`<h3>Faturamento · ${dataBR(r.dia)}</h3>${linha('Crédito',r.venda_credito)}${linha('Débito',r.venda_debito)}${linha('Pix',r.venda_pix)}${linha('Extras / voucher',r.venda_extras)}${linha('Dinheiro',r.venda_dinheiro)}${linha('Total do dia',r.faturamento_dia)}<div class="detail-note">${r.modo==='projetado'?'O total é projeção; a divisão por forma só aparece nos dias realizados.':'Total líquido de cancelamentos, acrescido das vendas em espécie.'}</div>`;
  if(tipo==='recebimentos'){
    if(!caixaRealizado){
      html=`<h3>Recebimentos · ${dataBR(r.dia)}</h3>${linha('Crédito conhecido',r.recebimento_credito)}${linha('Débito conhecido',r.recebimento_debito)}${linha('Projeção adicional',r.recebimento_projetado)}${linha('Total',r.recebimento_total)}<div class="detail-note">Crédito e débito seguem o vencimento líquido dos recebíveis; o restante usa a projeção de entradas.</div>`;
    }else{
      html=`<h3>Recebimentos · ${dataBR(r.dia)}</h3>${linha('Cartões liquidados',r.recebimento_credito)}${linha('Vendas via QR Code',r.recebimento_pix)}${linha('Outras entradas / transferências',r.recebimento_projetado)}${linha('Total',r.recebimento_total)}<div class="detail-note">As descrições seguem a classificação das fontes financeiras importadas; transferências e aumento do dinheiro em espécie entram em outras entradas.</div>`;
    }
  }
  if(tipo==='saldo'){
    if(SALDOS_DIA[r.dia]===undefined){
      pop.innerHTML=`<h3>Saldo em caixa · ${dataBR(r.dia)}</h3><div class="detail-note">Carregando composição…</div>`;posicionarPopover(pop,button);
      const {data,error}=await sb.rpc('listar_saldo_contas_dia',{p_dia:r.dia});
      if(error){console.error('Falha ao detalhar saldo do dia:',error);SALDOS_DIA[r.dia]=null;}
      else SALDOS_DIA[r.dia]=data||[];
      if(pop.dataset.dia!==r.dia||pop.dataset.tipo!=='saldo'||!pop.classList.contains('show'))return;
    }
    const contas=SALDOS_DIA[r.dia];
    const contasVisiveis=contas?.filter(c=>Math.abs(Number(c.saldo)||0)>=.005);
    html=contas
      ?`<h3>Saldo em caixa · ${dataBR(r.dia)}</h3>${contasVisiveis.map(c=>linha(c.conta,c.saldo)).join('')}${linha('Total',contas[0]?.saldo_total??r.saldo_caixa)}<div class="detail-note">Posição no fechamento desta data, formada pelas contas ativas configuradas para compor o caixa.</div>`
      :`<h3>Saldo em caixa · ${dataBR(r.dia)}</h3><div class="detail-note">A composição por conta não está disponível para esta data.</div>`;
  }
  if(tipo==='despesas'){
    if(!caixaRealizado){
      html=`<h3>Despesas · ${dataBR(r.dia)}</h3>${linha('Recorrentes',r.despesa_recorrente)}${linha('Não recorrentes',r.despesa_nao_recorrente)}${linha('Total',r.despesa_total)}<div class="detail-note">Recorrente usa a projeção fixa; não recorrente usa a projeção direta.</div>`;
    }else{
      const aviso=Number(r.despesa_recorrente_nao_conciliada)>0?`<div class="detail-warning">Há ${dinheiro(r.despesa_recorrente_nao_conciliada)} registrado como recorrente sem correspondência no total financeiro deste dia.</div>`:'';
      if(DESPESAS_DIA[r.dia]===undefined){
        pop.innerHTML=`<h3>Despesas · ${dataBR(r.dia)}</h3><div class="detail-note">Carregando despesas…</div>`;posicionarPopover(pop,button);
        const {data,error}=await sb.rpc('listar_despesas_dia',{p_dia:r.dia});
        if(error){console.error('Falha ao listar despesas do dia:',error);DESPESAS_DIA[r.dia]=null;}
        else DESPESAS_DIA[r.dia]=data||[];
        if(pop.dataset.dia!==r.dia||pop.dataset.tipo!=='despesas'||!pop.classList.contains('show'))return;
      }
      const itens=DESPESAS_DIA[r.dia];
      const corpo=itens?`${listaDespesas(itens,r.despesa_total)}<div class="detail-note">Inclui todas as saídas que movimentam o caixa e eventuais baixas do dinheiro pendente, mesmo quando não pertencem à DRE.</div>`:`${linha('Recorrentes',r.despesa_recorrente)}${linha('Não recorrentes',r.despesa_nao_recorrente)}${linha('Total',r.despesa_total)}<div class="detail-note">Não foi possível carregar a lista de despesas.</div>`;
      html=`<h3>Despesas · ${dataBR(r.dia)}</h3>${corpo}${aviso}`;
    }
  }
  pop.innerHTML=html;posicionarPopover(pop,button);
}

function posicionarPopover(pop,button){
  pop.classList.add('show');
  const rect=button.getBoundingClientRect(),w=245;pop.style.left=`${Math.max(8,Math.min(window.innerWidth-w-8,rect.right-w))}px`;pop.style.top=`${Math.min(window.innerHeight-pop.offsetHeight-8,rect.bottom+7)}px`;
}

function fecharDetalhe(){document.getElementById('detailPopover').classList.remove('show');}
if(HOVER_FINO){
  const pop=document.getElementById('detailPopover');
  pop.addEventListener('mouseenter',()=>clearTimeout(hoverTimer));
  pop.addEventListener('mouseleave',agendarFecharDetalhe);
}
document.addEventListener('click',event=>{if(!event.target.closest('#detailPopover'))fecharDetalhe();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')fecharDetalhe();});

async function carregar(mesForcado){
  const carga=++CARGA_ATUAL;
  const main=document.getElementById('main');
  const mes=typeof mesForcado==='string'?mesForcado:(document.getElementById('mesSel')?.value||mesAtual());
  main.innerHTML='<div class="loading">Carregando calendário…</div>';
  let data=null,error=null;
  for(let tentativa=1;tentativa<=3;tentativa++){
    if(carga!==CARGA_ATUAL)return;
    try{
      ({data,error}=await sb.rpc('listar_calendario_financeiro',{p_mes:`${mes}-01`}));
    }catch(falha){data=null;error=falha;}
    if(carga!==CARGA_ATUAL)return;
    if(!error||!erroTransitorio(error)||tentativa===3)break;
    main.innerHTML=`<div class="loading">O servidor demorou a responder. Tentando novamente… (${tentativa+1}/3)</div>`;
    await new Promise(resolve=>setTimeout(resolve,350*tentativa));
  }
  if(error){
    console.error('Falha ao carregar calendário:',error);
    main.innerHTML='<div class="erro">Não foi possível carregar o calendário financeiro.<br><button type="button" class="button secondary" id="tentarCalendario" style="margin-top:10px">Tentar novamente</button></div>';
    document.getElementById('tentarCalendario').addEventListener('click',()=>carregar(mes));
    return;
  }
  ROWS=data||[];DESPESAS_DIA={};SALDOS_DIA={};
  // O corte é global e só muda com uma nova importação, então basta uma
  // consulta por carga da página, não uma por mês navegado.
  if(CORTE===undefined){
    try{
      const {data:corte,error:erroCorte}=await sb.rpc('resumo_corte_caixa');
      if(erroCorte)throw erroCorte;
      CORTE=corte?.[0]||null;
    }catch(falha){console.error('Falha ao consultar o corte de caixa:',falha);CORTE=null;}
    if(carga!==CARGA_ATUAL)return;
  }
  render();document.getElementById('mesSel').value=mes;
}

(async()=>{AUTH=await SirFisherAuth.requireRole(sb);if(AUTH)await carregar();})();
</script>
