<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests">
<title>Painel · Conciliação contábil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<link href="assets/dashboard-common.css" rel="stylesheet">
<link href="assets/product-pages.css" rel="stylesheet">
<link href="assets/accessibility.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.108.2" integrity="sha384-JWEyvHh+lRf0sN/WWY+QTQwX+CyWqmNg4tkc8GQzAMEtR2wGNrCJlvnu1lHD1kDm" crossorigin="anonymous"></script>
<script src="assets/supabase-client.js"></script>
<script src="assets/app-config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/safe-dom.js"></script>
<script src="assets/dashboard-utils.js"></script>
<script src="assets/accessibility.js"></script>
<style>
  .head-meta{display:flex;align-items:center;gap:10px}
  .explain-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:11px;margin-bottom:15px}
  .explain-card{background:var(--card);border:1px solid var(--border);border-radius:11px;padding:13px}
  .explain-card h3{font-size:12.5px;margin-bottom:5px}.explain-card p{font-size:11px;color:var(--muted);line-height:1.5}
  .summary-card.alert .value{color:var(--red)}.summary-card.good .value{color:var(--green)}
  .summary-card.warn .value{color:#80611c}.pair{font-size:10.5px;color:var(--muted);line-height:1.4;min-width:210px}
  .decision-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.decision-actions .button{font-size:10px;padding:6px 8px}
  .decision-note{display:block;margin-top:5px;color:var(--muted)}
  .row-value.positive{color:var(--green)}.row-value.negative{color:var(--red)}
  .period-note{font-size:10.5px;color:var(--muted);margin-top:-10px;margin-bottom:15px}
  .deep-link-target{outline:3px solid rgba(0,166,166,.35);outline-offset:-3px;background:#f2fbfb}
  @media(max-width:720px){.head-meta{align-items:flex-end;flex-direction:column}.data-table{min-width:980px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="head-row"><div class="brand"><div class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M2 12s3-6 10-6 10 6 10 6-3 6-10 6S2 12 2 12z"/><circle cx="9" cy="12" r="1" fill="#fff"/></svg></div><div><h1 data-app-nome>Painel</h1><span data-app-subtitulo>Painel de Gestão</span></div></div><div class="head-meta"><span class="periodo"><select id="anoMesSel"></select></span><div class="unidade">Rotina contábil</div></div></div>
    <nav class="tabs"><a href="./">Visão Geral</a><a href="vendas.html">Faturamento</a><a href="caixa.html">Caixa</a><a href="dre.html">DRE</a><a href="despesas.html">Despesas</a><a href="conciliacao.html">Conciliação</a><a href="planejamento.html">Planejamento</a><a href="rotinas.html" class="routines active">Rotinas</a></nav>
  </header>
  <main id="main"><div class="loading">Auditando movimentos contábeis…</div></main>
</div>
<div class="toast" id="toast"></div>
<script>
const sb=SirFisherSupabase;
const esc=SirFisherDOM.escapeHTML;
const {rs}=SirFisherFormat;
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const STATUS_ESTORNO=new Set(['estorno_forte','estorno_provavel','estorno_analise']);
const STATUS_RESOLVIDO=new Set(['estorno_confirmado','descartado']);
const STATUS_ALERTA=new Set(['sem_contrapartida','ambiguo','classificacao_divergente',...STATUS_ESTORNO]);
const FILTROS_VALIDOS=new Set(['alertas','estornos','resolvidos','todos','conciliados','informativos']);
const query=new URLSearchParams(window.location.search);
const requestedMonth=/^\d{4}-\d{2}$/.test(query.get('mes')||'')?query.get('mes'):null;
const requestedFilter=FILTROS_VALIDOS.has(query.get('filtro'))?query.get('filtro'):null;
const requestedDecision=/^\d+$/.test(query.get('decisao')||'')?query.get('decisao'):null;
let RESUMO=[];
let RENDER_SEQ=0;
const param=(chave,padrao)=>window.SirFisherApp.number(chave,padrao);

function nomeMes(anoMes){return MESES[Number(anoMes.slice(5,7))-1]+' de '+anoMes.slice(0,4);}
function fmtData(value){return value?new Date(value+'T12:00:00').toLocaleDateString('pt-BR'):'—';}
function fmtMomento(dataHora,data){
  if(!dataHora)return fmtData(data)+' · horário indisponível';
  return new Date(dataHora).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function origemLabel(value){return({stone_extrato:'Stone',bb:'BB',bs_cash:'BS Cash',inter:'Inter',historico:'Histórico'})[value]||value||'—';}
function statusInfo(value){
  if(value==='conciliado')return['Conciliado','ok'];
  if(value==='classificacao_divergente')return['Classificação divergente','bad'];
  if(value==='ambiguo')return['Mais de um candidato','warn'];
  if(value==='sem_contrapartida')return['Sem contraparte','bad'];
  if(value==='estorno_forte')return['Possível estorno · forte','info'];
  if(value==='estorno_provavel')return['Possível estorno · provável','warn'];
  if(value==='estorno_analise')return['Possível estorno · analisar','bad'];
  if(value==='estorno_confirmado')return['Estorno confirmado','ok'];
  if(value==='descartado')return['Não relacionados','neutral'];
  return['Informativo','neutral'];
}
function soma(rows,field){return rows.reduce((total,row)=>total+Number(row[field]||0),0);}
function linhaResumoMes(anoMes){return RESUMO.filter(row=>row.ano_mes===anoMes);}
function chavePar(row){
  if(!row.par_origem||row.par_raw_id===null||row.par_raw_id===undefined)return null;
  return [`${row.origem}:${row.raw_id}`,`${row.par_origem}:${row.par_raw_id}`].sort().join('|');
}
function contarPares(rows,nivel){
  const pares=new Set();
  rows.filter(row=>row.nivel_reversao===nivel&&!row.decisao_id&&row.par_origem&&row.par_raw_id!==null).forEach(row=>{
    pares.add(chavePar(row));
  });
  return pares.size;
}
function toast(msg,isErr){const el=document.getElementById('toast');el.textContent=msg;el.className='toast show'+(isErr?' err':'');setTimeout(()=>el.className='toast',2600);}
async function atualizarResumo(){const {data,error}=await sb.from('app_conciliacao_contabil_resumo_mensal').select('*');if(!error)RESUMO=data||[];}

async function montarSeletor(){
  const {data,error}=await sb.from('app_conciliacao_contabil_resumo_mensal').select('*');
  if(error)throw error;
  RESUMO=data||[];
  const meses=[...new Set(RESUMO.map(row=>row.ano_mes))].sort();
  if(!meses.length)throw new Error('Nenhum movimento contábil encontrado.');
  const hoje=new Date();
  const corrente=hoje.getFullYear()+'-'+String(hoje.getMonth()+1).padStart(2,'0');
  const passados=meses.filter(mes=>mes<=corrente);
  const padrao=meses.includes(corrente)?corrente:(passados.at(-1)||meses.at(-1));
  const selecionado=requestedMonth&&meses.includes(requestedMonth)?requestedMonth:padrao;
  const seletor=document.getElementById('anoMesSel');
  seletor.innerHTML=meses.slice().reverse().map(mes=>`<option value="${mes}">${esc(nomeMes(mes))}</option>`).join('');
  seletor.value=selecionado;
  seletor.onchange=()=>renderMes(seletor.value);
  await renderMes(selecionado,{filter:requestedFilter,decisionId:requestedDecision});
}

async function renderMes(anoMes,navigation){
  const renderSeq=++RENDER_SEQ;
  const main=document.getElementById('main');
  main.innerHTML='<div class="loading">Auditando '+esc(nomeMes(anoMes))+'…</div>';
  const targetQuery=navigation&&navigation.decisionId
    ?sb.from('app_conciliacao_contabil_decisoes').select('*').eq('id',navigation.decisionId).maybeSingle()
    :Promise.resolve({data:null,error:null});
  const settled=await Promise.allSettled([
    sb.from('app_conciliacao_contabil').select('*').eq('ano_mes',anoMes).order('data_caixa',{ascending:false}).order('valor',{ascending:true}).limit(500),
    sb.from('app_conciliacao_contabil_decisoes').select('*').eq('ano_mes',anoMes).order('decidido_em',{ascending:false}).limit(50),
    targetQuery
  ]);
  if(renderSeq!==RENDER_SEQ)return;
  const resposta=index=>settled[index].status==='fulfilled'?settled[index].value:{data:null,error:settled[index].reason};
  const [movimentosResult,decisoesResult,targetResult]=[0,1,2].map(resposta);
  if(movimentosResult.error){main.innerHTML='<div class="erro">Não foi possível carregar a conciliação: '+esc(movimentosResult.error.message||String(movimentosResult.error))+'</div>';return;}
  const parcial=!!(decisoesResult.error||targetResult.error);
  const rows=movimentosResult.data||[];
  const decisoes=[...(decisoesResult.error?[]:(decisoesResult.data||[]))];
  if(targetResult.data&&targetResult.data.ano_mes===anoMes&&!decisoes.some(item=>String(item.id)===String(targetResult.data.id)))decisoes.push(targetResult.data);
  const zera=rows.filter(row=>row.espera_zerar);
  const conciliados=zera.filter(row=>row.status_conciliacao==='conciliado');
  const alertas=zera.filter(row=>STATUS_ALERTA.has(row.status_conciliacao));
  const informativos=rows.filter(row=>!row.espera_zerar);
  const estornosFortes=contarPares(rows,'forte');
  const estornosProvaveis=contarPares(rows,'provavel');
  const estornosAnalise=contarPares(rows,'analise');
  const resolvidos=new Set(rows.filter(row=>row.decisao_id).map(row=>row.decisao_id)).size;
  const saldo=soma(zera,'valor');
  const creditos=soma(zera.filter(row=>Number(row.valor)>0),'valor');
  const debitos=soma(zera.filter(row=>Number(row.valor)<0),'valor');
  const atualizado=rows[0]?.atualizado_em?new Date(rows[0].atualizado_em).toLocaleString('pt-BR'):'—';
  const prioridade=row=>STATUS_ALERTA.has(row.status_conciliacao)?0:(STATUS_RESOLVIDO.has(row.status_conciliacao)?2:(row.status_conciliacao==='conciliado'?1:3));
  const pares=new Map();
  const avulsos=[];
  rows.forEach(row=>{const chave=row.nivel_reversao?chavePar(row):null;if(!chave){avulsos.push(row);return;}const atual=pares.get(chave);if(!atual||STATUS_ESTORNO.has(row.status_conciliacao)&&!STATUS_ESTORNO.has(atual.status_conciliacao))pares.set(chave,row);});
  const detalhes=[...avulsos,...pares.values()].sort((a,b)=>{
    return prioridade(a)-prioridade(b)||Math.abs(Number(b.valor))-Math.abs(Number(a.valor));
  });
  const targetDecisionId=navigation&&navigation.decisionId?String(navigation.decisionId):null;
  const decisoesHtml=decisoes.map((item,index)=>{
    const focused=targetDecisionId===String(item.id);
    const marker=focused?` id="decisao-${esc(String(item.id))}" class="deep-link-target" tabindex="-1"`:'';
    return `<tr${marker}><td>${esc(new Date(item.decidido_em).toLocaleString('pt-BR'))}</td><td><span class="status ${item.ativa?'ok':'neutral'}">${esc(item.decisao==='estorno_confirmado'?'Estorno confirmado':'Não relacionados')}${item.ativa?'':' · desfeita'}</span></td><td>${esc(origemLabel(item.origem_a))} · ${fmtData(item.data_a)} · ${rs(item.valor_a)}<br>${esc(item.contraparte_a||'—')}</td><td>${esc(origemLabel(item.origem_b))} · ${fmtData(item.data_b)} · ${rs(item.valor_b)}<br>${esc(item.contraparte_b||'—')}</td><td>${esc(item.decidido_por_nome||'—')}</td><td>${item.ativa?`<button class="button danger history-undo" data-index="${index}" type="button">Desfazer</button>`:'—'}</td></tr>`;
  }).join('')||'<tr><td colspan="6" class="empty">Nenhuma decisão neste mês.</td></tr>';

  main.innerHTML=`
    <div class="page-intro"><div><h2>Conciliação contábil</h2><p>Confira os pares e conclua cada caso como estorno ou como movimentos não relacionados.</p></div><button id="reload" class="button secondary">Atualizar</button></div>
    ${parcial?'<div class="notice">Os movimentos foram carregados, mas o histórico de decisões está temporariamente incompleto.</div>':''}
    <div class="summary-grid">
      <div class="summary-card"><div class="label">Créditos que devem zerar</div><div class="value">${rs(creditos)}</div></div>
      <div class="summary-card"><div class="label">Débitos que devem zerar</div><div class="value">${rs(debitos)}</div></div>
      <div class="summary-card ${Math.abs(saldo)<=param('conciliacao_tolerancia_valor',0.01)?'good':'alert'}"><div class="label">Saldo líquido esperado: zero</div><div class="value">${rs(saldo)}</div></div>
      <div class="summary-card good"><div class="label">Movimentos conciliados</div><div class="value">${conciliados.length.toLocaleString('pt-BR')}</div></div>
      <div class="summary-card ${alertas.length?'alert':'good'}"><div class="label">Precisam revisão</div><div class="value">${alertas.length.toLocaleString('pt-BR')}</div></div>
      <div class="summary-card"><div class="label">Apenas informativos</div><div class="value">${informativos.length.toLocaleString('pt-BR')}</div></div>
      <div class="summary-card good"><div class="label">Pares de estorno · forte</div><div class="value">${estornosFortes.toLocaleString('pt-BR')}</div></div>
      <div class="summary-card warn"><div class="label">Pares de estorno · provável</div><div class="value">${estornosProvaveis.toLocaleString('pt-BR')}</div></div>
      <div class="summary-card ${estornosAnalise?'alert':'good'}"><div class="label">Pares de estorno · analisar</div><div class="value">${estornosAnalise.toLocaleString('pt-BR')}</div></div>
      <div class="summary-card good"><div class="label">Pares resolvidos</div><div class="value">${resolvidos.toLocaleString('pt-BR')}</div></div>
    </div>
    <div class="period-note">Base atualizada em ${esc(atualizado)}. Transferências usam janela de até ${param('conciliacao_janela_dias',5)} dias; possíveis estornos usam a configuração operacional vigente.</div>
    <div class="explain-grid">
      <div class="explain-card"><h3>Devem zerar</h3><p>Transferências entre contas e estornos precisam de uma entrada e uma saída equivalentes.</p></div>
      <div class="explain-card"><h3>Possível estorno</h3><p>Débito seguido de crédito do mesmo valor na mesma conta. Até ${param('estorno_forte_minutos',60)} minutos com contraparte ou descrição compatível é indício forte; nenhum lançamento é reclassificado automaticamente.</p></div>
      <div class="explain-card"><h3>Como concluir</h3><p>Confirmar estorno classifica as duas pontas juntas como CONTÁBIL. “Não relacionados” preserva as categorias e retira o par dos alertas. As duas decisões podem ser desfeitas.</p></div>
      <div class="explain-card"><h3>Classificação divergente</h3><p>A contraparte existe, mas está em outra categoria. É o principal indício de despesa ou receita contabilizada indevidamente.</p></div>
      <div class="explain-card"><h3>Limite dos extratos</h3><p>BB e Inter não fornecem horário; nesses bancos o painel usa data, valor, contraparte e descrição, mantendo o resultado como provável ou para análise.</p></div>
    </div>
    <section class="panel"><div class="panel-head"><div><h3>Movimentos de ${esc(nomeMes(anoMes))}</h3><div class="hint">Cada possível estorno aparece uma vez, com as duas pontas e as ações disponíveis.</div></div><select id="statusFiltro" class="field"><option value="alertas">Somente alertas</option><option value="estornos">Possíveis estornos</option><option value="resolvidos">Resolvidos</option><option value="todos">Todos</option><option value="conciliados">Conciliados</option><option value="informativos">Informativos</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Data e hora</th><th>Status</th><th>Conta</th><th>Categoria atual</th><th>Contraparte</th><th class="right">Valor</th><th>Possível par / decisão</th></tr></thead><tbody id="movimentosBody"></tbody></table></div></section>
    <section class="panel"><div class="panel-head"><div><h3>Decisões do mês</h3><div class="hint">Histórico auditável; decisões ativas podem ser desfeitas.</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Quando</th><th>Decisão</th><th>Primeira ponta</th><th>Segunda ponta</th><th>Responsável</th><th>Ação</th></tr></thead><tbody id="decisoesBody">${decisoesHtml}</tbody></table></div></section>
    <section class="panel"><div class="panel-head"><div><h3>Histórico mensal</h3><div class="hint">Saldo e quantidade de alertas dos movimentos que deveriam zerar.</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Mês</th><th class="right">Créditos</th><th class="right">Débitos</th><th class="right">Saldo</th><th class="right">Alertas</th></tr></thead><tbody>${[...new Set(RESUMO.map(row=>row.ano_mes))].sort().reverse().map(mes=>{const itens=linhaResumoMes(mes);const acionaveis=itens.filter(row=>STATUS_ALERTA.has(row.status_conciliacao));const cred=soma(itens.filter(row=>row.status_conciliacao!=='informativo'),'creditos');const deb=soma(itens.filter(row=>row.status_conciliacao!=='informativo'),'debitos');const liq=cred+deb;return`<tr><td>${esc(nomeMes(mes))}</td><td class="right">${rs(cred)}</td><td class="right">${rs(deb)}</td><td class="right" style="color:${Math.abs(liq)>param('conciliacao_tolerancia_valor',0.01)?'var(--red)':'var(--green)'}">${rs(liq)}</td><td class="right">${soma(acionaveis,'qtd').toLocaleString('pt-BR')}</td></tr>`;}).join('')}</tbody></table></div></section>`;

  const body=document.getElementById('movimentosBody');
  function desenhar(filtro){
    const filtrados=detalhes.filter(row=>filtro==='todos'||(filtro==='alertas'&&STATUS_ALERTA.has(row.status_conciliacao))||(filtro==='estornos'&&row.nivel_reversao&&!row.decisao_id)||(filtro==='resolvidos'&&row.decisao_id)||(filtro==='conciliados'&&row.status_conciliacao==='conciliado')||(filtro==='informativos'&&row.status_conciliacao==='informativo'));
    body.innerHTML=filtrados.map((row,index)=>{const[label,klass]=statusInfo(row.status_conciliacao);const intervalo=row.minutos_intervalo===null||row.minutos_intervalo===undefined?'':` · ${Number(row.minutos_intervalo).toLocaleString('pt-BR')} min`;const evidencia=row.evidencia_reversao?`<br><strong>${esc(row.evidencia_reversao)}</strong>${intervalo}`:'';let acoes='';if(row.nivel_reversao&&row.par_origem){acoes=row.decisao_id?`<div class="decision-actions"><button class="button danger pair-action" data-index="${index}" data-action="undo" type="button">Desfazer decisão</button></div>`:`<div class="decision-actions"><button class="button pair-action" data-index="${index}" data-action="estorno_confirmado" type="button">Confirmar estorno</button><button class="button secondary pair-action" data-index="${index}" data-action="nao_relacionados" type="button">Não são relacionados</button></div>`;}const par=row.par_origem?`${origemLabel(row.par_origem)} · ${fmtMomento(row.par_data_hora,row.par_data)} · ${rs(row.par_valor)}<br>${esc(row.par_contraparte||'—')} · ${esc(row.par_categoria||'Sem categoria')}${Number(row.qtd_candidatos)>1?` · ${Number(row.qtd_candidatos)} candidatos`:''}${evidencia}${acoes}`:'Nenhuma perna oposta encontrada';return`<tr><td>${fmtMomento(row.data_hora,row.data_caixa)}</td><td><span class="status ${klass}">${esc(label)}</span></td><td>${esc(origemLabel(row.origem))}</td><td>${esc(row.categoria||'Sem categoria')}</td><td>${esc(row.contraparte_nome||row.fornecedor||'—')}</td><td class="right row-value ${Number(row.valor)>=0?'positive':'negative'}">${rs(row.valor)}</td><td class="pair">${par}</td></tr>`;}).join('')||'<tr><td colspan="7" class="empty">Nenhum movimento neste filtro.</td></tr>';
    body.querySelectorAll('.pair-action').forEach(button=>button.onclick=()=>executarAcao(filtrados[Number(button.dataset.index)],button.dataset.action,anoMes,button));
  }
  const filtro=document.getElementById('statusFiltro');
  filtro.value=navigation&&FILTROS_VALIDOS.has(navigation.filter)?navigation.filter:(alertas.length?'alertas':'todos');
  filtro.onchange=()=>desenhar(filtro.value);
  document.getElementById('reload').onclick=()=>renderMes(anoMes,navigation);
  document.querySelectorAll('.history-undo').forEach(button=>button.onclick=()=>desfazerDecisao(decisoes[Number(button.dataset.index)],anoMes,button));
  desenhar(filtro.value);
  if(targetDecisionId){
    const target=document.getElementById('decisao-'+targetDecisionId);
    if(target){requestAnimationFrame(()=>{target.scrollIntoView({behavior:'smooth',block:'center'});target.focus({preventScroll:true});});}
    else toast('A decisão indicada não foi encontrada neste mês.',true);
  }
}

async function executarAcao(row,acao,anoMes,button){
  if(acao==='undo'){await desfazerDecisao({id:row.decisao_id},anoMes,button);return;}
  const mensagem=acao==='estorno_confirmado'?'Confirmar as duas pontas como Estornado?':'Confirmar que estas transações não são relacionadas?';
  if(!window.confirm(mensagem))return;
  button.closest('.decision-actions').querySelectorAll('button').forEach(item=>item.disabled=true);
  const {error}=await sb.rpc('decidir_conciliacao_contabil',{p_origem_a:row.origem,p_raw_id_a:row.raw_id,p_origem_b:row.par_origem,p_raw_id_b:row.par_raw_id,p_decisao:acao});
  if(error){toast('Não foi possível salvar: '+error.message,true);button.closest('.decision-actions').querySelectorAll('button').forEach(item=>item.disabled=false);return;}
  toast(acao==='estorno_confirmado'?'Estorno confirmado. Atualização do painel agendada.':'Par retirado dos alertas.');
  await atualizarResumo();
  await renderMes(anoMes);
}

async function desfazerDecisao(item,anoMes,button){
  if(!window.confirm('Desfazer esta decisão e restaurar os ajustes anteriores?'))return;
  button.disabled=true;
  const {error}=await sb.rpc('desfazer_decisao_conciliacao_contabil',{p_decisao_id:item.id});
  if(error){toast('Não foi possível desfazer: '+error.message,true);button.disabled=false;return;}
  toast('Decisão desfeita. Atualização do painel agendada.');
  await atualizarResumo();
  await renderMes(anoMes);
}

(async()=>{const auth=await SirFisherAuth.requireRole(sb);if(!auth)return;try{await montarSeletor();}catch(error){document.getElementById('main').innerHTML='<div class="erro">Não foi possível carregar a rotina: '+esc(error.message||String(error))+'</div>';}})();
</script>
